name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache Catch2 sources
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: catch2-v3.5.0-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            catch2-v3.5.0-${{ runner.os }}-
      - name: Validate C99-C23 capability matrix
        run: python3 scripts/check_c_conformance.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j 2
      - name: Unit and runtime tests
        run: ctest --test-dir build --output-on-failure
      - name: Golden end-to-end tests
        env:
          PLAINSPEAK_CC: clang
        run: ./scripts/run_golden_tests.sh build/plainspeak
